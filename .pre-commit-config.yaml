# Runs on every `git commit`. Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  # Use the project's own pinned ruff (from uv.lock) so hooks and CI never disagree.
  - repo: local
    hooks:
      # detect-private-key only catches PEM keys. This blocks API keys pasted into the
      # committed template: any *_KEY/SECRET/TOKEN/PASSWORD with a value fails the commit.
      - id: no-secrets-in-env-example
        name: no secret values in .env.example
        language: pygrep
        entry: '^[A-Z0-9_]*(KEY|SECRET|TOKEN|PASSWORD)[A-Z0-9_]*=[ \t]*[^ \t#\r\n]'
        files: ^\.env\.example$
      # Docker Compose reads `KEY=   # comment` as KEY="# comment" (dotenv doesn't):
      # comments for empty values must sit on their own line.
      - id: no-inline-comment-on-empty-env-value
        name: no inline comment after an empty value in .env.example
        language: pygrep
        entry: '^[A-Z0-9_]+=[ \t]+#'
        files: ^\.env\.example$
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
