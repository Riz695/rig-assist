[project]
name = "rig-assist"
version = "0.1.0"
description = "Multi-agent troubleshooting assistant for oil & gas equipment (RAG + CrewAI + FastAPI + Azure)"
authors = [
    { name = "Riz695", email = "rizqzuad@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.156.4",
    "fastembed>=0.9.0",
    "langfuse==4.17.0",
    "langgraph==1.2.15",
    "numpy>=2.4",
    "openai>=3.28.0,<4",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.20.0,<7",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1,<1.20",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
# Eval runs only (`make eval`): experiment tracking. Not in the API image or CI.
# Exact pin: 3.17.1/3.17.2 were under two weeks old when chosen (2026-10-24).
eval = [
    "mlflow==3.17.0",
]
# Fine-tuning the embedder (`make train`): PyTorch CPU wheels (no CUDA, ~200 MB instead of
# several GB) + sentence-transformers. Never installed in the API image or CI.
# Exact pins, each at least two weeks old on 2026-10-26 (sentence-transformers 6.2.0 and
# transformers 5.20.x were newer).
train = [
    "onnx==1.23.2",  # ONNX export (training/export_onnx.py): torch's exporter needs both
    "onnxscript==0.7.2",
    "sentence-transformers[train]==6.1.0",
    "torch==2.14.1",
    "transformers>=5.19,<5.20",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only packages mapped above come from here

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

# --- Tool configuration -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff also formats Python inside Markdown code blocks; docs like PLAN.md stay as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names), I: import sorting,
# B: bugbear (likely bugs), UP: pyupgrade (modern syntax), SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rig_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"  # slow tests: `make test-slow`
markers = [
    "slow: needs the train group and real models (ONNX export parity) or the real manuals (scenario files, about a minute); not in `make test` or CI",
    "integration: uses real data or models (manuals in data/raw, downloaded embedding models); skipped when unavailable",
]
filterwarnings = [
    # Tests run Qdrant in-memory, where payload indexes are a no-op; the server uses them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    # Raised inside MLflow 3.17's SQLAlchemy store, not by our code (tests/test_tracking.py).
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]

[tool.mypy]
# Lenient on purpose (see PLAN.md): check our code, don't fail on untyped third-party libs.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
