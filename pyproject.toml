[project]
name = "rig-assist"
version = "0.1.0"
description = "Multi-agent troubleshooting assistant for oil & gas equipment (RAG + CrewAI + FastAPI + Azure)"
authors = [
    { name = "Riz695", email = "rizqzuad@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.156.4",
    "openai>=3.28.0,<4",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.1",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

# --- Tool configuration -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff also formats Python inside Markdown code blocks; docs like PLAN.md stay as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names), I: import sorting,
# B: bugbear (likely bugs), UP: pyupgrade (modern syntax), SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rig_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: reads the real manuals in data/raw (skipped when they're absent, e.g. in CI)",
]

[tool.mypy]
# Lenient on purpose (see PLAN.md): check our code, don't fail on untyped third-party libs.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
